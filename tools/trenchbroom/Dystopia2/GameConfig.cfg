// TrenchBroom game configuration for Dystopia 2 (config format version 9,
// TrenchBroom 2024.2 or newer). See tools/trenchbroom/README.md.
{
    "version": 9,
    "name": "Dystopia 2",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve" },
        { "format": "Standard" }
    ],
    "filesystem": {
        // Relative to the game path set in Preferences > Games, which must be
        // the repository root. Materials are loaded from
        // <repo>/tools/trenchbroom/Dystopia2/textures/<collection>/<name>.png,
        // so textures/d2/floor.png becomes the material "d2/floor".
        "searchpath": "tools/trenchbroom/Dystopia2",
        "packageformat": { "extension": ".pk3", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [ ".png" ]
    },
    "entities": {
        "definitions": [ "d2.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger_*",
                "material": "d2/trigger" // applied when a brush is turned into a trigger via this tag
            },
            {
                "name": "Detail",
                "attribs": [],
                "match": "classname",
                "pattern": "func_detail"
            }
        ],
        "brushface": [
            {
                // Volumes such as cyber_zerog / cyber_jumppad / cyber_drain also use d2/trigger.
                "name": "Trigger material",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "*trigger"
            },
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "*clip"
            },
            {
                "name": "Nodraw",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "nodraw"
            },
            {
                "name": "Skip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "skip"
            },
            {
                "name": "Forcefield",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "forcefield"
            },
            {
                "name": "Glass",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "glass"
            }
        ]
    },
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": [],
        "defaults": {
            "materialName": "d2/wall", // honoured by TrenchBroom 2024.2 - 2026.2, ignored by newer builds
            "offset": [ 0, 0 ],
            "scale": [ 1, 1 ],
            "rotation": 0
        }
    }
}
