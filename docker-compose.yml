# Run on a VPS:  docker compose up -d --build
# Put a TLS-terminating reverse proxy (Caddy/nginx/Traefik) in front for https/wss.
services:
  dystopia2:
    build: .
    image: dystopia2:latest
    restart: unless-stopped
    ports:
      - "${D2_PORT:-8080}:8080"
    environment:
      MAX_ROOMS: "${D2_MAX_ROOMS:-16}"
      DEFAULT_MAP: d2_quarantine
